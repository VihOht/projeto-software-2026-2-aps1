spring.application.name=exercise
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:exercicio}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

rawg.api.url=https://api.rawg.io/api
rawg.api.key=${RAWG_API_KEY}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-bpbgrel3zl2chj7s.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://dev-bpbgrel3zl2chj7s.us.auth0.com/api/v2/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://0.0.0.0:5500}
