spring.application.name=enlistamento-service
server.port=8083

spring.datasource.url=jdbc:postgresql://${ENLISTAMENTO_DB_HOST:localhost}:5432/${ENLISTAMENTO_DB_NAME:enlistamento_db}
spring.datasource.username=${ENLISTAMENTO_DB_USER:usuario}
spring.datasource.password=${ENLISTAMENTO_DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
jogos.service.url=${JOGOS_SERVICE_URL:http://localhost:8080}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-bpbgrel3zl2chj7s.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://dev-bpbgrel3zl2chj7s.us.auth0.com/api/v2/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://0.0.0.0:5500}
