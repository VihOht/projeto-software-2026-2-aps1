name: Java CI with Maven

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}

  DB_HOST: postgres-exercicio
  DB_PORT: "5432"
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-ci:${{ github.sha }}

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ env.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-ci:${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ env.DOCKERHUB_TOKEN }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22

          envs: IMAGE_NAME,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,PROJECT_NAME,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD

          script: |
            set -e

            echo "Removing previous application..."
            docker rm -f "$PROJECT_NAME" 2>/dev/null || true

            echo "Cleaning unused Docker resources..."
            docker container prune --force
            docker image prune --all --force
            docker builder prune --all --force
            docker network prune --force

            echo "Available disk space:"
            df -h

            docker network inspect rede >/dev/null 2>&1 || \
              docker network create rede

            if docker container inspect "$DB_HOST" >/dev/null 2>&1; then
              docker start "$DB_HOST" >/dev/null 2>&1 || true
            else
              docker run -d \
                --name "$DB_HOST" \
                --network rede \
                --restart unless-stopped \
                -e POSTGRES_DB="$DB_NAME" \
                -e POSTGRES_USER="$DB_USER" \
                -e POSTGRES_PASSWORD="$DB_PASSWORD" \
                -v postgres-exercicio-data:/var/lib/postgresql \
                postgres:18
            fi


            echo "$DOCKERHUB_TOKEN" | \
              docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            docker pull "$IMAGE_NAME"

            docker run -d \
              --name "$PROJECT_NAME" \
              --network rede \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DB_HOST="$DB_HOST" \
              -e DB_PORT="$DB_PORT" \
              -e DB_NAME="$DB_NAME" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              "$IMAGE_NAME"

            echo "Running containers:"
            docker ps